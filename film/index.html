<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="510.9" data-width="1920" data-height="1080">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <img id="stamp" src="media/stamp.jpg" style="position:absolute;left:-9999px" alt="" />
  <div class="pre" aria-hidden="true">
    <span style="font-family:'Noto Serif Devanagari';font-weight:500">अ</span><span style="font-family:'Noto Serif Devanagari';font-weight:700">अ</span>
    <span style="font-family:'Noto Sans Devanagari';font-weight:500">अ</span><span style="font-family:'Noto Sans Devanagari';font-weight:700">अ</span>
    <span style="font-family:'Special Elite'">A</span><span style="font-family:'Cormorant Garamond';font-style:italic">A</span>
  </div>
</div>
<script>
/*
 * "पचास गज": Major Somnath Sharma and the Battle of Badgam. About 8.5 min, 1920 x 1080, one canvas drawn from t alone.
 * Every visual is keyed to the narration: L(n) is when narration line n starts (see ../script/badgam_longform_script_v2.md).
 * Look: sumi ink on warm paper, one accent (vermilion) that marks D Company, the airfield lifeline and the seal.
 * Ink strokes boil on twos (15 fps); camera and type move at 30 fps.
 */
(function () {
  'use strict';
  const S = STUDIO, B = window.BEATS, W = 1920, H = 1080;
  const PAPER = '#F2ECE0', INK = '#1B1A18', SOFT = '#5A544B', FAINT = 'rgba(27,26,24,0.18)', ACC = '#C2402E';
  const SERIF = '"Noto Serif Devanagari", serif', SANS = '"Noto Sans Devanagari", sans-serif', TYPE = '"Special Elite", monospace';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const stampImg = document.getElementById('stamp');
  const L = n => B.lines[n - 1].s, E = n => B.lines[n - 1].e;

  // ---------- math ----------
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (t, a, d, e) => S.seg(t, a, d, e || 'power2.inOut');
  function hash(i) { i = i | 0; i = Math.imul(i ^ (i >>> 16), 0x45d9f3b); i = Math.imul(i ^ (i >>> 16), 0x45d9f3b); i ^= i >>> 16; return (i >>> 0) / 4294967296; }
  function vn(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i * 7919 + s * 104729), hash((i + 1) * 7919 + s * 104729), u); }
  let SEED = 0;                                   // boil seed, changes every 2 frames

  // ---------- paper ----------
  const T = 1024, paper = document.createElement('canvas'); paper.width = paper.height = T;
  (function () {
    const p = paper.getContext('2d'), rnd = S.rng(1947);
    p.fillStyle = PAPER; p.fillRect(0, 0, T, T);
    const m = 128, mc = document.createElement('canvas'); mc.width = mc.height = m;
    const mx = mc.getContext('2d'), id = mx.createImageData(m, m);
    for (let y = 0; y < m; y++) for (let x = 0; x < m; x++) {
      let n = 0, a = 1, tot = 0;
      for (let o = 0; o < 3; o++) {
        const P = [4, 8, 16][o], X = x * P / m, Y = y * P / m, xi = Math.floor(X), yi = Math.floor(Y), fx = X - xi, fy = Y - yi;
        const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
        const h = (i, j) => hash(((i % P + P) % P) * 92821 + ((j % P + P) % P) * 68917 + o * 1013);
        n += a * lerp(lerp(h(xi, yi), h(xi + 1, yi), ux), lerp(h(xi, yi + 1), h(xi + 1, yi + 1), ux), uy); tot += a; a *= 0.5;
      }
      const v = n / tot - 0.5, k = (y * m + x) * 4;
      if (v < 0) { id.data[k] = 140; id.data[k + 1] = 112; id.data[k + 2] = 74; id.data[k + 3] = Math.min(255, -v * 170); }
      else { id.data[k] = 255; id.data[k + 1] = 252; id.data[k + 2] = 244; id.data[k + 3] = Math.min(255, v * 120); }
    }
    mx.putImageData(id, 0, 0); p.globalAlpha = 0.26; p.drawImage(mc, 0, 0, T, T); p.globalAlpha = 1;
    for (let i = 0; i < 2600; i++) {
      const x = rnd() * T, y = rnd() * T, Ln = 6 + rnd() * (rnd() < 0.1 ? 110 : 34), a = rnd() * Math.PI * 2;
      p.strokeStyle = rnd() < 0.7 ? `rgba(140,112,74,${0.05 + rnd() * 0.07})` : `rgba(255,253,246,${0.25 + rnd() * 0.3})`;
      p.lineWidth = 0.5 + rnd();
      for (const ox of [-T, 0, T]) for (const oy of [-T, 0, T]) { p.beginPath(); p.moveTo(x + ox, y + oy); p.lineTo(x + ox + Math.cos(a) * Ln, y + oy + Math.sin(a) * Ln); p.stroke(); }
    }
  })();
  const paperPat = ctx.createPattern(paper, 'repeat');
  const grain = document.createElement('canvas'); grain.width = grain.height = 512;
  (function () {
    const g = grain.getContext('2d'), d = g.createImageData(512, 512), rnd = S.rng(77);
    for (let i = 0; i < 512 * 512; i++) { const r = rnd(), k = i * 4; if (r < 0.5) { d.data[k] = 70; d.data[k + 1] = 55; d.data[k + 2] = 38; d.data[k + 3] = (0.5 - r) * 44; } else { d.data[k] = 255; d.data[k + 1] = 251; d.data[k + 2] = 242; d.data[k + 3] = (r - 0.5) * 48; } }
    g.putImageData(d, 0, 0);
  })();
  const grainPat = ctx.createPattern(grain, 'repeat');

  // ---------- brush: a polyline drawn on with pressure, taper and boil ----------
  const PATHS = new Map();
  function sample(pts) {   // Catmull-Rom through [x, y, w?] points, every 3 px
    const key = JSON.stringify(pts); if (PATHS.has(key)) return PATHS.get(key);
    const n = pts.length, out = [];
    const get = i => pts[clamp(i, 0, n - 1)];
    for (let i = 0; i < n - 1; i++) {
      const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2), len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]), m = Math.max(2, Math.ceil(len / 3));
      for (let s = 0; s < m; s++) {
        const u = s / m, u2 = u * u, u3 = u2 * u;
        const f = c => 0.5 * ((2 * p1[c]) + (-p0[c] + p2[c]) * u + (2 * p0[c] - 5 * p1[c] + 4 * p2[c] - p3[c]) * u2 + (-p0[c] + 3 * p1[c] - 3 * p2[c] + p3[c]) * u3);
        out.push([f(0), f(1), lerp(p1[2] == null ? 1 : p1[2], p2[2] == null ? 1 : p2[2], u)]);
      }
    }
    out.push([pts[n - 1][0], pts[n - 1][1], pts[n - 1][2] == null ? 1 : pts[n - 1][2]]);
    PATHS.set(key, out); return out;
  }
  // draw a stroke: p = 0..1 drawn, w = base width, col, id seeds the boil
  function brush(c, pts, p, w, id, col, dry) {
    if (p <= 0) return;
    const P = sample(pts), hi = Math.max(1, Math.floor((P.length - 1) * clamp(p, 0, 1)));
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = col || INK;
    let runW = -1;
    const pt = i => {
      const u = i / (P.length - 1), taper = Math.min(1, u / 0.05 + 0.25) * Math.min(1, (1 - u) / 0.12 + 0.2);
      return [P[i][0] + (vn(i * 0.05 + SEED * 13.1 + id * 3.7, 1) - 0.5) * 2.4, P[i][1] + (vn(i * 0.05 + SEED * 17.7 + id * 5.1, 2) - 0.5) * 2.4,
        Math.max(0.6, w * P[i][2] * taper * (0.86 + 0.28 * vn(i * 0.04 + id * 1.3, 4)))];
    };
    let a = pt(0);
    c.beginPath(); c.moveTo(a[0], a[1]);
    for (let i = 1; i <= hi; i++) {
      const b = pt(i);
      if (runW < 0 || Math.abs(b[2] - runW) > 0.6) { if (runW >= 0) { c.lineWidth = runW; c.stroke(); c.beginPath(); c.moveTo(a[0], a[1]); } runW = b[2]; }
      c.lineTo(b[0], b[1]); a = b;
    }
    c.lineWidth = runW; c.stroke();
    if (dry) {   // dry-brush streaks cut out of the stroke
      c.save(); c.globalCompositeOperation = 'destination-out'; c.strokeStyle = '#000'; c.lineWidth = 1;
      for (let b = 0; b < 5; b++) {
        c.beginPath(); let open = false;
        for (let i = 0; i < hi; i++) {
          const q = pt(i), nz = vn(i * 0.03 + b * 17 + id, 9);
          if (nz < 0.35 * dry) { if (!open) { c.moveTo(q[0] + (b - 2) * q[2] * 0.18, q[1] + (b - 2) * q[2] * 0.18); open = true; } else c.lineTo(q[0] + (b - 2) * q[2] * 0.18, q[1] + (b - 2) * q[2] * 0.18); }
          else open = false;
        }
        c.stroke();
      }
      c.restore();
    }
    if (p < 1) { c.fillStyle = col || INK; c.beginPath(); c.arc(a[0], a[1], Math.max(2.2, runW * 0.6), 0, Math.PI * 2); c.fill(); }
  }
  function blob(c, x, y, r, a, k, col) {
    c.globalAlpha = a; c.fillStyle = col || INK; c.beginPath();
    const nv = r > 16 ? 40 : 9;
    for (let j = 0; j <= nv; j++) { const th = j / nv * Math.PI * 2, rr = r * (0.8 + 0.36 * vn((j % nv) * 0.5 + k * 7.7, 8)); j ? c.lineTo(x + Math.cos(th) * rr, y + Math.sin(th) * rr) : c.moveTo(x + Math.cos(th) * rr, y + Math.sin(th) * rr); }
    c.closePath(); c.fill(); c.globalAlpha = 1;
  }
  // an arrow along a path, drawn on with p; head appears at the end
  function arrow(c, pts, p, w, id, col) {
    brush(c, pts, p, w, id, col);
    if (p < 0.85) return;
    const P = sample(pts), a = P[P.length - 4] || P[0], b = P[P.length - 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]), k = seg(p, 0.85, 0.15, 'power2.out'), s = (w * 3.6 + 14) * k;
    brush(c, [[b[0] - Math.cos(ang - 0.5) * s, b[1] - Math.sin(ang - 0.5) * s, 0.6], [b[0], b[1], 1], [b[0] - Math.cos(ang + 0.5) * s, b[1] - Math.sin(ang + 0.5) * s, 0.6]], 1, w, id + 0.5, col);
  }

  // ---------- type ----------
  function txt(c, str, x, y, size, opt, p) {
    if (p !== undefined && p <= 0) return;
    opt = opt || {};
    c.save();
    c.font = `${opt.weight || 700} ${size}px ${opt.font || SERIF}`; c.textAlign = opt.align || 'left'; c.textBaseline = 'alphabetic';
    const w = c.measureText(str).width, x0 = opt.align === 'center' ? x - w / 2 : opt.align === 'right' ? x - w : x;
    c.globalAlpha = (opt.alpha == null ? 1 : opt.alpha);
    if (p !== undefined && p < 1) { c.beginPath(); c.rect(x0 - 10, y - size * 1.4, (w + 20) * p + 8, size * 2.0); c.clip(); }
    c.fillStyle = opt.col || INK; c.fillText(str, x, y);
    c.restore();
    return w;
  }
  // a line of text that writes itself in from a time, fades out at `out`
  function write(c, t, at, str, x, y, size, opt) {
    opt = opt || {};
    const dur = opt.dur || (0.35 + 0.03 * str.length), p = seg(t, at, dur, 'sine.inOut');
    const out = opt.out ? 1 - seg(t, opt.out, 0.5, 'power2.in') : 1;
    if (p <= 0 || out <= 0) return;
    txt(c, str, x, y, size, Object.assign({}, opt, { alpha: (opt.alpha == null ? 1 : opt.alpha) * out }), p);
  }
  // a date or place card: small accent rule + text
  function card(c, t, at, big, small, x, y, opt) {
    opt = opt || {};
    const out = opt.out ? 1 - seg(t, opt.out, 0.5, 'power2.in') : 1, k = seg(t, at, 0.6, 'expo.out');
    if (k <= 0 || out <= 0) return;
    c.save(); c.globalAlpha = out;
    c.fillStyle = ACC; c.fillRect(x, y - (opt.size || 76) - 34, 120 * k, 7);
    c.restore();
    write(c, t, at + 0.1, big, x, y, opt.size || 76, { out: opt.out });
    if (small) write(c, t, at + 0.5, small, x + 2, y + 56, 36, { weight: 500, col: SOFT, out: opt.out });
  }

  // ---------- subtitles: the spoken Hindi, line by line, in chunks ----------
  const SUBS = [];
  B.lines.forEach(l => {
    const parts = l.text.replace(/\s+/g, ' ').split(/(?<=[,।?])\s+/), chunks = [];
    let cur = '';
    parts.forEach(p => { if ((cur + ' ' + p).trim().length > 44 && cur) { chunks.push(cur.trim()); cur = p; } else cur = (cur + ' ' + p).trim(); });
    if (cur) chunks.push(cur);
    const tot = chunks.reduce((a, s) => a + s.length, 0); let t0 = l.s;
    chunks.forEach(ch => { const d = (l.e - l.s) * ch.length / tot; SUBS.push({ s: t0, e: t0 + d, text: ch }); t0 += d; });
  });
  function subtitles(c, t) {
    const s = SUBS.find(x => t >= x.s - 0.05 && t < x.e + 0.25);
    if (!s) return;
    c.save(); c.font = `700 44px ${SANS}`; c.textAlign = 'center';
    const w = c.measureText(s.text).width, y = 1008;
    c.globalAlpha = 0.86; c.fillStyle = 'rgba(242,236,224,0.92)'; c.fillRect(960 - w / 2 - 22, y - 46, w + 44, 64);
    c.globalAlpha = 1; c.fillStyle = INK; c.fillText(s.text, 960, y);
    c.restore();
  }

  // ---------- the Kashmir valley map (lon, lat to px) ----------
  const PLACES = {
    muz: [73.47, 34.37, 'मुज़फ़्फ़राबाद'], uri: [74.05, 34.08, 'उड़ी'], bar: [74.34, 34.20, 'बारामूला'], pat: [74.56, 34.16, 'पट्टन'],
    sgr: [74.80, 34.08, 'श्रीनगर'], bad: [74.72, 34.02, 'बडगाम'], air: [74.77, 33.99, 'हवाई अड्डा'], mag: [74.57, 34.10, 'मागाम'], gul: [74.38, 34.05, 'गुलमर्ग']
  };
  const JHELUM = [[75.15, 33.73], [75.0, 33.86], [74.88, 33.99], [74.80, 34.08], [74.70, 34.16], [74.62, 34.27], [74.60, 34.33], [74.47, 34.30], [74.34, 34.20], [74.2, 34.16], [74.05, 34.08], [73.85, 34.13], [73.65, 34.24], [73.47, 34.37]];
  const PIRPANJAL = [[73.9, 33.95], [74.1, 33.86], [74.3, 33.74], [74.55, 33.62], [74.85, 33.52], [75.15, 33.48], [75.45, 33.5]];
  const HIMALAYA = [[74.2, 34.62], [74.55, 34.55], [74.9, 34.42], [75.15, 34.27], [75.4, 34.08], [75.6, 33.9]];
  const ROAD = [[73.47, 34.37], [73.65, 34.24], [73.85, 34.13], [74.05, 34.08], [74.2, 34.16], [74.34, 34.20], [74.56, 34.16], [74.70, 34.12], [74.80, 34.08]];
  function proj(v, lon, lat) { return [960 + (lon - v.lon) * v.s * Math.cos(34 * Math.PI / 180), 540 - (lat - v.lat) * v.s]; }
  function ridge(c, v, line, p, id) {   // a mountain range as a run of brush peaks
    const pts = line.map(q => proj(v, q[0], q[1])), P = sample(pts.map(q => [q[0], q[1], 1]));
    const step = 46, nPk = Math.floor(P.length * 3 / step), shown = Math.floor(nPk * clamp(p, 0, 1));
    for (let k = 0; k < shown; k++) {
      const i = Math.min(P.length - 2, Math.floor(k * step / 3)), q = P[i], h = (30 + 46 * hash(k * 13 + id)) * v.s / 1400;
      const w = (26 + 22 * hash(k * 7 + id)) * v.s / 1400;
      brush(c, [[q[0] - w, q[1] + h * 0.15, 0.4], [q[0] - w * 0.2, q[1] - h, 1], [q[0] + w * 0.15, q[1] - h * 0.9, 0.9], [q[0] + w, q[1] + h * 0.1, 0.4]], 1, 3.2, id * 100 + k, k % 3 ? SOFT : INK);
    }
  }
  function valley(c, t, v, o) {   // o: {ridges, river, road, places:[ids], at}
    const at = o.at;
    ridge(c, v, PIRPANJAL, seg(t, at, 2.0), 3);
    ridge(c, v, HIMALAYA, seg(t, at + 0.3, 2.0), 7);
    brush(c, JHELUM.map(q => proj(v, q[0], q[1]).concat(2.6)), seg(t, at + 0.6, 2.2, 'sine.inOut'), 3.4, 11, SOFT);
    const wl = proj(v, 74.6, 34.36), wk = seg(t, at + 1.2, 1.0);
    if (wk > 0) { c.save(); c.globalAlpha = 0.5 * wk; c.strokeStyle = SOFT; c.lineWidth = 2.5; c.beginPath(); c.ellipse(wl[0], wl[1], 0.12 * v.s * 0.83, 0.05 * v.s, -0.2, 0, Math.PI * 2); c.stroke(); c.restore(); }
    if (o.road) { c.save(); c.setLineDash([10, 12]); c.globalAlpha = 0.45 * seg(t, at + 1, 1); c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); ROAD.forEach((q, i) => { const a = proj(v, q[0], q[1]); i ? c.lineTo(a[0], a[1]) : c.moveTo(a[0], a[1]); }); c.stroke(); c.restore(); }
    (o.places || []).forEach((id, i) => {
      const P = PLACES[id], a = proj(v, P[0], P[1]), k = seg(t, at + 1.2 + i * 0.15, 0.5, 'back.out(1.6)');
      if (k <= 0) return;
      const acc = id === 'air' && o.airAcc;
      blob(c, a[0], a[1], (acc ? 11 : 8) * k, 1, i + 3, acc ? ACC : INK);
      txt(c, P[2], a[0] + 18, a[1] - 14, id === 'sgr' || acc ? 44 : 36, { weight: 700, col: acc ? ACC : INK, alpha: k });
    });
  }

  // ---------- the tactical map: airfield, Badgam, the companies ----------
  const AIR = [1460, 520], BAD = [560, 470], POS = [700, 610];   // D Company's position, south of Badgam
  function tactical(c, t, at, o) {
    o = o || {};
    // high ground: soft hatched ridges to the west
    for (let k = 0; k < 7; k++) { const x = 140 + k * 90, y = 300 + hash(k) * 520; brush(c, [[x - 40, y + 8, 0.4], [x, y - 30, 1], [x + 40, y + 8, 0.4]], seg(t, at + k * 0.05, 0.6), 3, 300 + k, SOFT); }
    // runway
    const rk = seg(t, at + 0.2, 1.0);
    brush(c, [[AIR[0] - 210, AIR[1] - 26, 1], [AIR[0] + 210, AIR[1] - 26, 1], [AIR[0] + 210, AIR[1] + 26, 1], [AIR[0] - 210, AIR[1] + 26, 1], [AIR[0] - 208, AIR[1] - 24, 1]], rk, 4.5, 310, o.airAcc ? ACC : INK);
    if (rk > 0.8) { c.save(); c.setLineDash([18, 16]); c.strokeStyle = o.airAcc ? ACC : INK; c.globalAlpha = 0.6; c.lineWidth = 2; c.beginPath(); c.moveTo(AIR[0] - 190, AIR[1]); c.lineTo(AIR[0] + 190, AIR[1]); c.stroke(); c.restore(); }
    write(c, t, at + 0.8, 'श्रीनगर हवाई अड्डा', AIR[0] - 210, AIR[1] - 52, 34, { weight: 500, col: o.airAcc ? ACC : INK });
    // Badgam village: little roofs
    for (let k = 0; k < 9; k++) {
      const x = BAD[0] - 120 + (k % 5) * 58 + (hash(k * 3) - 0.5) * 20, y = BAD[1] - 50 + Math.floor(k / 5) * 64;
      brush(c, [[x - 20, y + 16, 0.5], [x - 20, y, 1], [x, y - 16, 1], [x + 20, y, 1], [x + 20, y + 16, 0.5]], seg(t, at + 0.4 + k * 0.06, 0.4), 3, 320 + k);
    }
    write(c, t, at + 1.0, 'बडगाम', BAD[0] - 120, BAD[1] - 92, 38, { weight: 700 });
    // distance bar
    const dk = seg(t, at + 1.4, 1.0);
    if (dk > 0) {
      c.save(); c.globalAlpha = dk; c.strokeStyle = INK; c.lineWidth = 2; c.setLineDash([6, 10]);
      c.beginPath(); c.moveTo(BAD[0] + 160, BAD[1] + 10); c.lineTo(lerp(BAD[0] + 160, AIR[0] - 230, dk), lerp(BAD[1] + 10, AIR[1], dk)); c.stroke(); c.restore();
      write(c, t, at + 2.0, '5 कि.मी.', (BAD[0] + AIR[0]) / 2 - 40, (BAD[1] + AIR[1]) / 2 - 18, 34, { weight: 500, col: SOFT });
    }
  }
  // a company block: rectangle with a label, drawn in ink or accent
  function company(c, x, y, k, label, acc, id) {
    if (k <= 0) return;
